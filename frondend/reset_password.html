<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | StudentMS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #1e293b;
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        a {
            color: #a5b4fc;
        }

        #message {
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Reset Password</h1>
        <p>Choose a new password for your StudentMS account.</p>

        <form id="resetForm">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="At least 8 characters"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="Enter the password again"
                required
            >

            <button type="submit" id="submitButton">
                Reset Password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back" href="login.html">Back to Login</a>
    </main>

    <script>
        const API_BASE = "http://localhost:3000";
        const token = new URLSearchParams(window.location.search)
            .get("token");

        const form = document.getElementById("resetForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        if (!token) {
            message.textContent =
                "Reset token is missing. Please request a new reset link.";
            button.disabled = true;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {
                message.textContent =
                    "Password must be at least 8 characters long.";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            message.textContent = "Updating password...";

            try {
                const response = await fetch(
                    `${API_BASE}/api/reset-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token,
                            newPassword
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Unable to reset password."
                    );
                }

                form.reset();
                message.textContent =
                    data.message + " You can now return to login.";

                button.disabled = true;

            } catch (error) {
                message.textContent =
                    error.message || "Unable to connect to the server.";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
