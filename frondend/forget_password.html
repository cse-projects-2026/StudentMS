<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudentMS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #1e293b;
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 22px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            overflow-wrap: anywhere;
        }

        a {
            color: #a5b4fc;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Forgot Password?</h1>
        <p>Enter the email address registered with your StudentMS account. If an account exists, you'll receive a password reset link.</p>

        <form id="forgotForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit" id="submitButton">
                Send Reset Link
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back" href="login.html">Back to Login</a>
    </main>

    <script>
        const API_BASE = "https://studentms-1-59un.onrender.com";

        const form = document.getElementById("forgotForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            message.textContent = "Sending request...";

            try {
                const response = await fetch(
                    `${API_BASE}/api/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                message.textContent = data.message;
                form.reset();

            } catch (error) {
                message.textContent =
                    error.message || "Unable to connect to the server.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
